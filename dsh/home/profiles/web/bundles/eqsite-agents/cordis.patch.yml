# EqSiteCMS Router preset: agent composition for multi-agent development workflow
- insert:
    - id: preset-eqsite-router
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: eqsite-router
        name: EqSiteCMS Router
        description: Router preset for EqSiteCMS multi-agent workflow with role-based delegation
        order: 0
        plugins:
          - id: persona
            name: '@deepseek-ai/dsh-persona'
            config:
              complete: !!js |
                (() => {
                  const fs = process.getBuiltinModule('node:fs');
                  const path = process.getBuiltinModule('node:path');
                  const file = path.resolve(dshHomePath(), '..', '..', 'agents', 'router.md');
                  if (!fs.existsSync(file)) {
                    throw new Error('agents/router.md not found at ' + file);
                  }
                  const content = fs.readFileSync(file, 'utf8');
                  return 'Ты — Router проекта EqSiteCMS. Твоя роль определена составом preset eqsite-router.\n\n' + content;
                })()
              suffix: Your working directory is {{cwd}}.
          - id: agent-instructions
            name: '@deepseek-ai/dsh-agent-instructions'
            config:
              maxBytes: 65536
          - id: tool-bash
            name: '@deepseek-ai/dsh-tool-bash'
            disabled: !!js process.platform === 'win32'
          - id: tool-pwsh
            name: '@deepseek-ai/dsh-tool-pwsh'
            disabled: !!js process.platform !== 'win32'
          - id: tool-fs
            name: '@deepseek-ai/dsh-tool-fs'
          - id: tool-fs-search
            name: '@deepseek-ai/dsh-tool-fs-search'
            config:
              sampleOverCapGlobResults: false
          - id: tool-jobs
            name: '@deepseek-ai/dsh-tool-jobs'
          - id: skill-filesystem
            name: '@deepseek-ai/dsh-skill-filesystem'
            config:
              customSkillDirs: !!js |
                (() => {
                  const path = process.getBuiltinModule('node:path');
                  return [path.resolve(dshHomePath(), '..', '..', '.claude', 'skills')];
                })()
          - id: tool-skill
            name: '@deepseek-ai/dsh-tool-skill'
          - id: command-goal
            name: '@deepseek-ai/dsh-command-goal'
          - id: tool-goal
            name: '@deepseek-ai/dsh-tool-goal'
          - id: planning
            name: cordis:group
            group: true
            isolate:
              planMode: true
            config:
              - id: plan-mode
                name: '@deepseek-ai/dsh-plan-mode'
                config:
                  section: |
                    You are in plan mode. Stay in plan mode until exit_plan_mode succeeds or the user switches the session mode. Imperative language to implement changes means plan the implementation, not execute it. A user's conversational agreement — including an answer confirming something you asked — approves nothing and does not end plan mode; fold the confirmed decision into the plan and submit it through exit_plan_mode.

                    Explore first. Use non-mutating reads, searches, static analysis, and checks to ground the plan in the actual repository. Do not edit or write files, change configuration, run formatters or code generation that rewrites tracked files, commit, or otherwise carry out the plan. Prefer existing functions and patterns over new machinery.

                    The tool catalog stays the same across modes for request-cache stability. These plan-mode rules override any later tool description or guidance that suggests using mutation tools; those tools remain listed to keep the tool catalog unchanged. Do not use todo_write to track this planning phase: it tracks implementation after an approved plan, while the plan itself belongs in exit_plan_mode.

                    Resolve discoverable facts by inspection. Use ask_user_question only for user-owned choices or material ambiguity that inspection cannot answer. Do not ask the user where code lives or how current behavior works when you can find out.

                    Make the plan decision-complete: state the goal and success criteria; group implementation changes by subsystem; identify public API, schema, and data-flow changes; cover edge cases, failure modes, tests, acceptance criteria, and explicit assumptions. Keep it concise enough to review but detailed enough that another engineer can implement it without making design decisions.

                    When ready, call exit_plan_mode with the complete plan markdown, starting with a # title. Make exit_plan_mode the only and final tool call in that assistant response: it presents the plan for approval, and implementation begins only in a later step after approval. Do not paste the final plan as a plain reply or ask "should I proceed?" through prose or ask_user_question. If review rejects it, incorporate the feedback and present again. If the review channel is unavailable or aborted, stay in plan mode and ask the user to switch modes manually; do not proceed with implementation.
          - id: compaction
            name: cordis:group
            group: true
            isolate:
              compaction: true
              toolResultPruner: true
            config:
              - id: compaction-basic
                name: '@deepseek-ai/dsh-compaction-basic'
              - id: command-compact
                name: '@deepseek-ai/dsh-command-compact'
              - id: tool-result-pruner
                name: '@deepseek-ai/dsh-compaction-tool-result-pruner'
                config:
                  thresholdChars: 8192
                  headChars: 4096
                  tailChars: 1024
          - id: delegation
            name: cordis:group
            group: true
            isolate:
              workflowEngine: true
            config:
              - id: tool-subagent-control
                name: '@deepseek-ai/dsh-tool-subagent-control'
              - id: tool-subagent-list-agents
                name: '@deepseek-ai/dsh-tool-subagent-control/list-agents'
              - id: delegate-planner
                name: '@deepseek-ai/dsh-tool-subagent'
                config:
                  provider: spawn
                  toolName: delegate_planner
                  maxDepth: 1
                  backgroundMode: continuable
                  modelSelectionSettings: false
                  enableRunInBackground: true
                  toolFilter:
                    deny:
                      - delegate_planner
                      - delegate_backend
                      - delegate_frontend
                      - delegate_site_consumer
                      - delegate_quality_gate
                      - workflow
                      - ask_user_question
                  persona: !!js |
                    (() => {
                      const fs = process.getBuiltinModule('node:fs');
                      const path = process.getBuiltinModule('node:path');
                      const file = path.resolve(dshHomePath(), '..', '..', 'agents', 'planner.md');
                      if (!fs.existsSync(file)) {
                        throw new Error('agents/planner.md not found at ' + file);
                      }
                      const content = fs.readFileSync(file, 'utf8');
                      const match = content.match(/<!-- dsh-persona:begin -->([\s\S]*?)<!-- dsh-persona:end -->/);
                      if (!match) {
                        throw new Error('dsh-persona markers missing in agents/planner.md');
                      }
                      return 'Ты — агент Planner проекта EqSiteCMS; роль назначена Router через delegate_planner. agents/router.md не читай.\n\n' + match[1].trim();
                    })()
              - id: delegate-backend
                name: '@deepseek-ai/dsh-tool-subagent'
                config:
                  provider: spawn
                  toolName: delegate_backend
                  maxDepth: 1
                  backgroundMode: continuable
                  modelSelectionSettings: false
                  enableRunInBackground: true
                  toolFilter:
                    deny:
                      - delegate_planner
                      - delegate_backend
                      - delegate_frontend
                      - delegate_site_consumer
                      - delegate_quality_gate
                      - workflow
                      - ask_user_question
                  persona: !!js |
                    (() => {
                      const fs = process.getBuiltinModule('node:fs');
                      const path = process.getBuiltinModule('node:path');
                      const file = path.resolve(dshHomePath(), '..', '..', 'agents', 'backend.md');
                      if (!fs.existsSync(file)) {
                        throw new Error('agents/backend.md not found at ' + file);
                      }
                      const content = fs.readFileSync(file, 'utf8');
                      const match = content.match(/<!-- dsh-persona:begin -->([\s\S]*?)<!-- dsh-persona:end -->/);
                      if (!match) {
                        throw new Error('dsh-persona markers missing in agents/backend.md');
                      }
                      return 'Ты — агент Backend проекта EqSiteCMS; роль назначена Router через delegate_backend. agents/router.md не читай.\n\n' + match[1].trim();
                    })()
              - id: delegate-frontend
                name: '@deepseek-ai/dsh-tool-subagent'
                config:
                  provider: spawn
                  toolName: delegate_frontend
                  maxDepth: 1
                  backgroundMode: continuable
                  modelSelectionSettings: false
                  enableRunInBackground: true
                  toolFilter:
                    deny:
                      - delegate_planner
                      - delegate_backend
                      - delegate_frontend
                      - delegate_site_consumer
                      - delegate_quality_gate
                      - workflow
                      - ask_user_question
                  persona: !!js |
                    (() => {
                      const fs = process.getBuiltinModule('node:fs');
                      const path = process.getBuiltinModule('node:path');
                      const file = path.resolve(dshHomePath(), '..', '..', 'agents', 'frontend.md');
                      if (!fs.existsSync(file)) {
                        throw new Error('agents/frontend.md not found at ' + file);
                      }
                      const content = fs.readFileSync(file, 'utf8');
                      const match = content.match(/<!-- dsh-persona:begin -->([\s\S]*?)<!-- dsh-persona:end -->/);
                      if (!match) {
                        throw new Error('dsh-persona markers missing in agents/frontend.md');
                      }
                      return 'Ты — агент Frontend проекта EqSiteCMS; роль назначена Router через delegate_frontend. agents/router.md не читай.\n\n' + match[1].trim();
                    })()
              - id: delegate-site-consumer
                name: '@deepseek-ai/dsh-tool-subagent'
                config:
                  provider: spawn
                  toolName: delegate_site_consumer
                  maxDepth: 1
                  backgroundMode: continuable
                  modelSelectionSettings: false
                  enableRunInBackground: true
                  toolFilter:
                    deny:
                      - delegate_planner
                      - delegate_backend
                      - delegate_frontend
                      - delegate_site_consumer
                      - delegate_quality_gate
                      - workflow
                      - ask_user_question
                  persona: !!js |
                    (() => {
                      const fs = process.getBuiltinModule('node:fs');
                      const path = process.getBuiltinModule('node:path');
                      const file = path.resolve(dshHomePath(), '..', '..', 'agents', 'site_consumer.md');
                      if (!fs.existsSync(file)) {
                        throw new Error('agents/site_consumer.md not found at ' + file);
                      }
                      const content = fs.readFileSync(file, 'utf8');
                      const match = content.match(/<!-- dsh-persona:begin -->([\s\S]*?)<!-- dsh-persona:end -->/);
                      if (!match) {
                        throw new Error('dsh-persona markers missing in agents/site_consumer.md');
                      }
                      return 'Ты — агент Site Consumer проекта EqSiteCMS; роль назначена Router через delegate_site_consumer. agents/router.md не читай.\n\n' + match[1].trim();
                    })()
              - id: delegate-quality-gate
                name: '@deepseek-ai/dsh-tool-subagent'
                config:
                  provider: spawn
                  toolName: delegate_quality_gate
                  maxDepth: 1
                  backgroundMode: continuable
                  modelSelectionSettings: false
                  enableRunInBackground: true
                  toolFilter:
                    deny:
                      - delegate_planner
                      - delegate_backend
                      - delegate_frontend
                      - delegate_site_consumer
                      - delegate_quality_gate
                      - workflow
                      - ask_user_question
                  persona: !!js |
                    (() => {
                      const fs = process.getBuiltinModule('node:fs');
                      const path = process.getBuiltinModule('node:path');
                      const file = path.resolve(dshHomePath(), '..', '..', 'agents', 'quality_gate.md');
                      if (!fs.existsSync(file)) {
                        throw new Error('agents/quality_gate.md not found at ' + file);
                      }
                      const content = fs.readFileSync(file, 'utf8');
                      const match = content.match(/<!-- dsh-persona:begin -->([\s\S]*?)<!-- dsh-persona:end -->/);
                      if (!match) {
                        throw new Error('dsh-persona markers missing in agents/quality_gate.md');
                      }
                      return 'Ты — агент Quality Gate проекта EqSiteCMS; роль назначена Router через delegate_quality_gate. agents/router.md не читай.\n\n' + match[1].trim();
                    })()
              - id: workflow-ptc
                name: '@deepseek-ai/dsh-workflow-ptc'
                config:
                  provider: spawn
              - id: tool-workflow
                name: '@deepseek-ai/dsh-tool-workflow'
          - id: tool-ask-user
            name: '@deepseek-ai/dsh-tool-ask-user'
          - id: tool-todo
            name: '@deepseek-ai/dsh-tool-todo'
            config:
              allowParallelInProgress: true
          - id: tool-web
            name: '@deepseek-ai/dsh-tool-web'
            config:
              fetch: true
              searchTimeoutMs: 60000
          - id: present
            name: '@deepseek-ai/dsh-tool-present'
