services:
  ya-metrica-service:
    build:
      context: ../services/ya-metrica-service
      dockerfile: Dockerfile
    image: eqsitecms-ya-metrica:latest
    container_name: eqsitecms-ya-metrica-service
    restart: always
    env_file:
      - path: ../services/ya-metrica-service/.env
        required: true
    ports:
      - "${EXPOSE_YA_METRICA_SERVICE_PORT}:8000"
    expose:
      - "8000"
    volumes:
      - ../services/ya-metrica-service/src:/app/src:${DEV_MOUNT:-ro}
    working_dir: /app/
    command: ["uv", "run", "--no-sync", "uvicorn", "main:app", "--app-dir", "src", "--host", "0.0.0.0", "--port", "8000", "--reload", "--reload-dir", "/app/src"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health').read()"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - eqsitecms_network

  ya-metrica-migration:
    build:
      context: ../services/ya-metrica-service
      dockerfile: Dockerfile
    image: eqsitecms-ya-metrica-migration:latest
    container_name: eqsitecms-ya-metrica-service-migration
    restart: "no"
    env_file:
      - path: ../services/ya-metrica-service/.env
        required: true
    volumes:
      - ../services/ya-metrica-service/src:/app/src:${DEV_MOUNT:-ro}
    working_dir: /app/src
    command: >
      sh -c 'if [ "$$SKIP_MIGRATIONS" = "true" ]; then
        echo "Миграции пропущены (SKIP_MIGRATIONS=true)";
        exit 0;
      else
        uv run alembic -c alembic.ini upgrade head;
      fi'
    networks:
      - eqsitecms_network

  ya-metrica-celery-worker:
    build:
      context: ../services/ya-metrica-service
      dockerfile: Dockerfile
    image: eqsitecms-ya-metrica:latest
    container_name: eqsitecms-ya-metrica-celery-worker
    restart: always
    env_file:
      - path: ../services/ya-metrica-service/.env
        required: true
    volumes:
      - ../services/ya-metrica-service/src:/app/src:${DEV_MOUNT:-ro}
    working_dir: /app/src
    hostname: ya-metrica-worker
    stop_grace_period: 300s
    command: >-
      uv run --no-sync celery -A workers.celery_app worker -Q ya_metrica -l info
      --concurrency=${WORKER_CONCURRENCY:-1} --hostname ya-metrica-worker@%h
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          timeout 10s uv run --no-sync celery -A workers.celery_app inspect ping
          --destination ya-metrica-worker@ya-metrica-worker --timeout 5 | grep -q pong
      interval: 15s
      timeout: 12s
      retries: 5
      start_period: 20s
    networks:
      - eqsitecms_network

  ya-metrica-celery-beat:
    build:
      context: ../services/ya-metrica-service
      dockerfile: Dockerfile
    image: eqsitecms-ya-metrica:latest
    container_name: eqsitecms-ya-metrica-celery-beat
    restart: always
    env_file:
      - path: ../services/ya-metrica-service/.env
        required: true
    volumes:
      - ../services/ya-metrica-service/src:/app/src:${DEV_MOUNT:-ro}
    working_dir: /app/src
    # One beat instance; container_name prevents accidental scaling.
    command: >-
      uv run --no-sync celery -A workers.celery_app beat -l info
      --schedule /app/celerybeat-schedule
    networks:
      - eqsitecms_network

networks:
  eqsitecms_network:
    external: true
