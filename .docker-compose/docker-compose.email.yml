services:
  email-service:
    build:
      context: ../services/email-service
      dockerfile: Dockerfile
    image: eqsitecms-email:latest
    container_name: eqsitecms-email-service
    restart: always
    env_file:
      - path: ../services/email-service/.env
        required: true
    expose:
      - "8000"
    volumes:
      - ../services/email-service/src:/app/src:${DEV_MOUNT:-ro}
    working_dir: /app/
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health').read()"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - eqsitecms_network

  email-migration:
    build:
      context: ../services/email-service
      dockerfile: Dockerfile
    image: eqsitecms-email-migration:latest
    container_name: eqsitecmsemail-service-migration
    restart: "no"
    env_file:
      - path: ../services/email-service/.env
        required: true
    volumes:
      - ../services/email-service/src:/app/src:${DEV_MOUNT:-ro}
    working_dir: /app/src
    command: >
      sh -c 'if [ "$$SKIP_MIGRATIONS" = "true" ]; then
        echo "Миграции пропущены (SKIP_MIGRATIONS=true)";
        exit 0;
      else
        uv run alembic -c alembic.ini upgrade head;
      fi'
    networks:
      - eqsitecms_network

  celery-worker:
    build:
      context: ../services/email-service
      dockerfile: Dockerfile
    image: eqsitecms-email-celery:latest
    container_name: eqsitecms-email-celery-worker
    restart: always
    env_file:
      - path: ../services/email-service/.env
        required: true
    volumes:
      - ../services/email-service/src:/app/src:${DEV_MOUNT:-ro}
    working_dir: /app/
    hostname: email-worker
    depends_on:
      redis:
        condition: service_healthy
    command: >-
      uv run --no-sync celery -A workers.celery_app worker -Q email -l info
      --hostname email-worker@%h
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          timeout 10s uv run --no-sync celery -A workers.celery_app inspect ping
          --destination email-worker@email-worker --timeout 5
          | tee /tmp/celery-readiness.log | grep -q pong
      interval: 15s
      timeout: 12s
      retries: 5
      start_period: 20s
    networks:
      - eqsitecms_network

networks:
  eqsitecms_network:
    external: true
