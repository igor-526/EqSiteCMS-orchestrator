services:
  db:
    image: postgres:16
    container_name: eqsitecms-db
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_NAME}
    expose:
      - 5432
    ports:
      - "${EXPOSE_DB_PORT}:5432"
    volumes:
      - eqsitecms_db_data:/var/lib/postgresql/data
    networks:
      - eqsitecms_network

  db-notifications:
    image: postgres:16
    container_name: eqsitecms-db-notifications
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_NOTIFICATIONS_USER}
      POSTGRES_PASSWORD: ${POSTGRES_NOTIFICATIONS_PASSWORD}
      POSTGRES_DB: ${POSTGRES_NOTIFICATIONS_NAME}
    expose:
      - 5432
    ports:
      - "${EXPOSE_NOTIFICATIONS_DB_PORT}:5432"
    volumes:
      - eqsitecms_notifications_db_data:/var/lib/postgresql/data
    networks:
      - eqsitecms_network

  db-email:
    image: postgres:16
    container_name: eqsitecms-db-email
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_EMAIL_USER}
      POSTGRES_PASSWORD: ${POSTGRES_EMAIL_PASSWORD}
      POSTGRES_DB: ${POSTGRES_EMAIL_NAME}
    expose:
      - 5432
    ports:
      - "${EXPOSE_EMAIL_DB_PORT}:5432"
    volumes:
      - eqsitecms_email_db_data:/var/lib/postgresql/data
    networks:
      - eqsitecms_network

  minio:
    image: minio/minio:latest
    container_name: eqsitecms-minio
    restart: always
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    expose:
      - 9000
    ports:
      - "${EXPOSE_MINIO_API_PORT:-9000}:9000"
      - "${EXPOSE_MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - eqsitecms_minio_data:/data
    networks:
      - eqsitecms_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  nats:
    image: nats:2-alpine
    container_name: eqsitecms-nats
    restart: unless-stopped
    command: ["--js", "--sd", "/data"]
    ports:
      - "${NATS_PORT:-4222}:4222"
      - "8222:8222"
    volumes:
      - eqsitecms_nats_data:/data
    networks:
      - eqsitecms_network

  redis:
    image: redis:7-alpine
    container_name: eqsitecms-redis
    restart: always
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}"]
    expose:
      - 6379
    ports:
      - "${EXPOSE_REDIS_PORT:-6379}:6379"
    volumes:
      - eqsitecms_redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" ping | grep -qx PONG"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    networks:
      - eqsitecms_network

networks:
  eqsitecms_network:
    external: true

volumes:
  eqsitecms_db_data:
    name: ${EQSITECMS_DB_VOLUME:-docker-compose_eqsitecms_db_data}
  eqsitecms_notifications_db_data:
    name: ${EQSITECMS_NOTIFICATIONS_DB_VOLUME:-docker-compose_eqsitecms_notifications_db_data}
  eqsitecms_email_db_data:
    name: ${EQSITECMS_EMAIL_DB_VOLUME:-docker-compose_eqsitecms_email_db_data}
  eqsitecms_minio_data:
    name: ${EQSITECMS_MINIO_VOLUME:-docker-compose_eqsitecms_minio_data}
  eqsitecms_nats_data:
    name: ${EQSITECMS_NATS_VOLUME:-docker-compose_eqsitecms_nats_data}
  eqsitecms_redis_data:
    name: ${EQSITECMS_REDIS_VOLUME:-docker-compose_eqsitecms_redis_data}
