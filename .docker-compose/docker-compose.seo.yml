services:
  seo-service:
    build:
      context: ../services/seo-service
      dockerfile: Dockerfile
    image: eqsitecms-seo:latest
    container_name: eqsitecms-seo-service
    restart: always
    env_file:
      - path: ../services/seo-service/.env
        required: true
    expose:
      - "8000"
    volumes:
      - ../services/seo-service/src:/app/src:${DEV_MOUNT:-ro}
    working_dir: /app/
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health').read()"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - eqsitecms_network

  seo-migration:
    build:
      context: ../services/seo-service
      dockerfile: Dockerfile
    image: eqsitecms-seo-migration:latest
    container_name: eqsitecms-seo-service-migration
    restart: "no"
    env_file:
      - path: ../services/seo-service/.env
        required: true
    volumes:
      - ../services/seo-service/src:/app/src:${DEV_MOUNT:-ro}
    working_dir: /app/src
    command: >
      sh -c 'if [ "$$SKIP_MIGRATIONS" = "true" ]; then
        echo "Миграции пропущены (SKIP_MIGRATIONS=true)";
        exit 0;
      else
        uv run alembic -c alembic.ini upgrade head;
      fi'
    networks:
      - eqsitecms_network

  seo-celery-worker:
    build:
      context: ../services/seo-service
      dockerfile: Dockerfile
    image: eqsitecms-seo-celery:latest
    container_name: eqsitecms-seo-celery-worker
    restart: always
    env_file:
      - path: ../services/seo-service/.env
        required: true
    volumes:
      - ../services/seo-service/src:/app/src:${DEV_MOUNT:-ro}
    working_dir: /app/
    hostname: seo-worker
    depends_on:
      seo-migration:
        condition: service_completed_successfully
    command: >-
      uv run --no-sync celery -A src.celery_app worker -Q seo -l info
      --hostname seo-worker@%h
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          timeout 10s uv run --no-sync celery -A src.celery_app inspect ping
          --destination seo-worker@seo-worker --timeout 5
          | tee /tmp/celery-readiness.log | grep -q pong
      interval: 15s
      timeout: 12s
      retries: 5
      start_period: 20s
    networks:
      - eqsitecms_network

  seo-celery-beat:
    build:
      context: ../services/seo-service
      dockerfile: Dockerfile
    image: eqsitecms-seo-celery-beat:latest
    container_name: eqsitecms-seo-celery-beat
    restart: always
    env_file:
      - path: ../services/seo-service/.env
        required: true
    volumes:
      - ../services/seo-service/src:/app/src:${DEV_MOUNT:-ro}
    working_dir: /app/
    depends_on:
      seo-migration:
        condition: service_completed_successfully
    command: >-
      uv run --no-sync celery -A src.celery_app beat -l info
    networks:
      - eqsitecms_network

networks:
  eqsitecms_network:
    external: true
