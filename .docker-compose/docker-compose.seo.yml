services:
  seo-service:
    build:
      context: ../services/seo-service
      dockerfile: Dockerfile
    image: eqsitecms-seo:latest
    container_name: eqsitecms-seo-service
    restart: always
    env_file:
      - path: ../services/seo-service/.env
        required: true
    ports:
      - "${EXPOSE_SEO_SERVICE_PORT}:8000"
    expose:
      - "8000"
    volumes:
      - ../services/seo-service/src:/app/src:${DEV_MOUNT:-ro}
    working_dir: /app/
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health').read()"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - eqsitecms_network

  seo-migration:
    build:
      context: ../services/seo-service
      dockerfile: Dockerfile
    image: eqsitecms-seo-migration:latest
    container_name: eqsitecms-seo-service-migration
    restart: "no"
    env_file:
      - path: ../services/seo-service/.env
        required: true
    volumes:
      - ../services/seo-service/src:/app/src:${DEV_MOUNT:-ro}
    working_dir: /app/src
    command: >
      sh -c 'if [ "$$SKIP_MIGRATIONS" = "true" ]; then
        echo "Миграции пропущены (SKIP_MIGRATIONS=true)";
        exit 0;
      else
        uv run alembic -c alembic.ini upgrade head;
      fi'
    networks:
      - eqsitecms_network

networks:
  eqsitecms_network:
    external: true
